name: full cycle test

# The mechanism is exit-code driven: known defects never fail the build,
# unexpected failures always do.
# `contents: write` is what lets the last step commit the ledger back to main.
# Without it the token is read-only and `git push` fails with exit 128.
permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt

      - name: Run the full cycle
        id: cycle
        run: |
          .venv/bin/python "full cycle test mechanism/1.all files/shared/run.py" \
            --label "pr-${{ github.event.pull_request.number || github.ref_name }}"

      - name: Publish the report
        if: always()
        run: |
          latest=$(ls -d "full cycle test mechanism/1.all files"/run-* | sort | tail -1)
          cat "$latest/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-cycle-report
          path: |
            full cycle test mechanism/1.all files/run-*/report.md
            full cycle test mechanism/1.all files/run-*/results.json
            full cycle test mechanism/1.all files/run-*/counts.json
          retention-days: 30

      # Commit the updated skill ledger + index back so history accumulates.
      # Bookkeeping only. If this fails (fork PR, protected branch, expired
      # token) the *results are still valid* — the cycle already passed above.
      # `continue-on-error` keeps a green suite green.
      - name: Persist the skill ledger
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          LEDGER="full cycle test mechanism/2.skills/ledger.jsonl"
          INDEX="full cycle test mechanism/2.skills/skills-index.md"
          git config user.name  "full-cycle-bot"
          git config user.email "bot@example.invalid"
          git add "$LEDGER" "$INDEX"
          if git diff --cached --quiet; then
            echo "::notice::ledger already up to date - nothing to commit"
            exit 0
          fi
          git commit -m "chore(full-cycle): record run $(date -u +%Y%m%dT%H%M)"
          git push && echo "::notice::ledger committed to main"
